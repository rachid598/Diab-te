name: Build APK Android

# Déclenchement manuel depuis l'onglet Actions, ou automatique quand le code
# de l'app change sur la branche de développement.
on:
  workflow_dispatch:
  push:
    branches: [claude/meal-carb-estimator-app-twxpqp]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'src/**'
      - 'vendor/**'
      - 'icons/**'
      - 'manifest.webmanifest'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/**'
      - 'android-src/**'
      - '.github/workflows/android.yml'

# Nécessaire pour publier l'APK et le bundle de mise à jour dans des releases.
permissions:
  contents: write

# Les exécutions s'enchaînent au lieu de s'annuler. Avec cancel-in-progress,
# pousser une version pendant que la précédente compilait annulait son build ET
# la publication de son bundle : la version disparaissait purement et
# simplement, l'app restant bloquée sur la dernière réellement publiée.
concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 exige Node >= 22 : un Node plus ancien fait échouer « cap » net.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Capacitor
        run: npm install --no-audit --no-fund

      # APP_VERSION dans js/app.js fait autorité pour tout : nom de version
      # Android, version du bundle OTA, et comparaison faite par l'app au
      # démarrage. Une seule source de vérité, donc pas de dérive possible.
      - name: Lire la version de l'app
        id: version
        run: |
          APP_VERSION=$(grep -oP "APP_VERSION = '\K[0-9]+" js/app.js)
          test -n "$APP_VERSION" || { echo "APP_VERSION introuvable dans js/app.js"; exit 1; }
          echo "app=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle=1.$APP_VERSION.0" >> "$GITHUB_OUTPUT"
          echo "Version de l'app : $APP_VERSION (bundle 1.$APP_VERSION.0)"

      # Garde-fou : le bundle de plugins est committé, il doit correspondre aux
      # versions déclarées dans package.json. S'il a changé, c'est qu'on a oublié
      # de relancer scripts/build-plugins.sh — l'APK partirait alors avec des
      # plugins JS désaccordés du natif.
      - name: Vérifier vendor/capacitor-plugins.js
        run: |
          cp vendor/capacitor-plugins.js /tmp/committed.js
          bash scripts/build-plugins.sh
          if ! cmp -s /tmp/committed.js vendor/capacitor-plugins.js; then
            echo "::error::vendor/capacitor-plugins.js n'est pas à jour."
            echo "Lance scripts/build-plugins.sh et committe le résultat."
            exit 1
          fi
          echo "Bundle de plugins conforme."

      # Gradle refuse de compiler si une licence du SDK n'est pas acceptée.
      # Sans effet si elles le sont déjà, et ne doit jamais faire échouer le job.
      - name: Accepter les licences du SDK Android
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Préparer les fichiers web (www/)
        run: bash scripts/build-www.sh

      - name: Générer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      # getUserMedia (scan de code-barres) exige la permission CAMERA déclarée.
      # Capacitor ne l'ajoute pas par défaut : on l'insère avant <application>.
      # Les autres permissions (notifications, démarrage) viennent des manifestes
      # des plugins et sont fusionnées automatiquement par Gradle.
      - name: Déclarer la permission caméra
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            perl -0pi -e 's{(<application)}{<uses-permission android:name="android.permission.CAMERA" />\n\n    $1}' "$MANIFEST"
          fi
          grep -n 'uses-permission' "$MANIFEST"

      # La version native doit suivre APP_VERSION. Le plugin de mise à jour
      # compare la version d'un bundle téléchargé à celle de l'APK : si l'APK
      # restait figé à « 1.0 », l'installation d'un APK plus récent n'effacerait
      # pas les anciens bundles. versionCode doit aussi croître pour qu'Android
      # accepte la réinstallation par-dessus.
      - name: Aligner la version Android
        env:
          APP_VERSION: ${{ steps.version.outputs.app }}
          BUNDLE_VERSION: ${{ steps.version.outputs.bundle }}
        run: |
          GRADLE=android/app/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode $APP_VERSION/" "$GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"$BUNDLE_VERSION\"/" "$GRADLE"
          grep -n 'versionCode\|versionName' "$GRADLE"

      # Raccourcis d'appui long sur l'icône + schéma glucovision:// qui les porte.
      # Au restaurant, ça évite d'ouvrir l'app puis de chercher le bouton Photo.
      - name: Ajouter les raccourcis d'écran d'accueil
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values

          cat > android/app/src/main/res/xml/shortcuts.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shortcuts xmlns:android="http://schemas.android.com/apk/res/android">
            <shortcut
              android:shortcutId="photo"
              android:enabled="true"
              android:shortcutShortLabel="@string/shortcut_photo_short"
              android:shortcutLongLabel="@string/shortcut_photo_long">
              <intent
                android:action="android.intent.action.VIEW"
                android:targetPackage="io.github.rachid598.glucovision"
                android:targetClass="io.github.rachid598.glucovision.MainActivity"
                android:data="glucovision://photo" />
            </shortcut>
            <shortcut
              android:shortcutId="manuel"
              android:enabled="true"
              android:shortcutShortLabel="@string/shortcut_manuel_short"
              android:shortcutLongLabel="@string/shortcut_manuel_long">
              <intent
                android:action="android.intent.action.VIEW"
                android:targetPackage="io.github.rachid598.glucovision"
                android:targetClass="io.github.rachid598.glucovision.MainActivity"
                android:data="glucovision://manuel" />
            </shortcut>
          </shortcuts>
          XML

          cat > android/app/src/main/res/values/shortcuts_strings.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="shortcut_photo_short">Photo</string>
            <string name="shortcut_photo_long">Photographier un repas</string>
            <string name="shortcut_manuel_short">Manuel</string>
            <string name="shortcut_manuel_long">Saisie manuelle</string>
          </resources>
          XML

          # Seule la meta-data est nécessaire : les intentions des raccourcis sont
          # EXPLICITES (targetPackage + targetClass), elles n'ont donc pas besoin
          # d'un filtre. On évite ainsi d'exposer glucovision:// au navigateur,
          # ce qui laisserait n'importe quelle page web ouvrir l'appareil photo.
          python3 - "$MANIFEST" <<'PY'
          import re, sys
          path = sys.argv[1]
          s = open(path, encoding='utf-8').read()
          if 'android.app.shortcuts' in s:
              print('deja present')
              sys.exit(0)
          extra = ('\n            <meta-data android:name="android.app.shortcuts"\n'
                   '                android:resource="@xml/shortcuts" />\n')
          m = re.search(r'(<activity\b[^>]*MainActivity.*?)(\n\s*</activity>)', s, re.S)
          if not m:
              sys.exit('MainActivity introuvable dans le manifeste')
          s = s[:m.end(1)] + extra + s[m.end(1):]
          open(path, 'w', encoding='utf-8').write(s)
          print('raccourcis declares')
          PY
          grep -n 'android.app.shortcuts' "$MANIFEST"

      # Mesure de profondeur ARCore. Le projet Android étant régénéré à chaque
      # build par « cap add android », les sources natives vivent dans
      # android-src/ et sont recopiées ici. MainActivity est remplacé : un plugin
      # déclaré dans le projet de l'app n'est pas découvert automatiquement, il
      # faut l'enregistrer avant super.onCreate().
      - name: Injecter le plugin de profondeur (ARCore)
        run: |
          PKG=android/app/src/main/java/io/github/rachid598/glucovision
          test -d "$PKG" || { echo "::error::Paquet Java introuvable : $PKG"; find android/app/src/main/java -type d; exit 1; }
          cp android-src/*.java "$PKG"/
          ls -1 "$PKG"

          GRADLE=android/app/build.gradle
          if ! grep -q 'com.google.ar:core' "$GRADLE"; then
            perl -0pi -e 's{(dependencies \{)}{$1\n    implementation "com.google.ar:core:1.54.0"}' "$GRADLE"
          fi
          grep -n 'com.google.ar:core' "$GRADLE"

          # « optional » et non « required » : l'APK doit rester installable et
          # utilisable sur un appareil sans ARCore, la mesure n'étant qu'un plus.
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" <<'PY'
          import re, sys
          path = sys.argv[1]
          s = open(path, encoding='utf-8').read()
          if 'com.google.ar.core' not in s:
              entry = ('\n        <meta-data android:name="com.google.ar.core" android:value="optional" />\n')
              m = re.search(r'(<application\b[^>]*>)', s)
              if not m:
                  sys.exit('balise <application> introuvable')
              s = s[:m.end(1)] + entry + s[m.end(1):]
          if 'DepthScanActivity' not in s:
              act = ('\n        <activity\n'
                     '            android:name=".DepthScanActivity"\n'
                     '            android:exported="false"\n'
                     '            android:screenOrientation="portrait"\n'
                     '            android:configChanges="orientation|screenSize|keyboardHidden" />\n')
              m = re.search(r'(</application>)', s)
              s = s[:m.start(1)] + act + s[m.start(1):]
          open(path, 'w', encoding='utf-8').write(s)
          print('manifeste ARCore mis a jour')
          PY
          grep -n 'com.google.ar.core\|DepthScanActivity' "$MANIFEST"

      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$SRC" || { echo "APK introuvable"; find android -name '*.apk'; exit 1; }
          mkdir -p dist
          cp "$SRC" dist/glucovision.apk
          echo "size=$(du -h dist/glucovision.apk | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "APK : $(du -h dist/glucovision.apk)"

      # Bundle de mise à jour OTA : les mêmes fichiers web que l'APK, en archive.
      # C'est ce qui évite de réinstaller l'APK à chaque version — l'app le
      # télécharge et remplace son contenu web toute seule.
      - name: Préparer le bundle de mise à jour
        env:
          APP_VERSION: ${{ steps.version.outputs.app }}
          BUNDLE_VERSION: ${{ steps.version.outputs.bundle }}
          REPO: ${{ github.repository }}
        run: |
          # index.html doit être à la RACINE de l'archive.
          (cd www && zip -qr ../dist/www.zip .)
          cat > dist/latest.json <<EOF
          {
            "appVersion": "$APP_VERSION",
            "version": "$BUNDLE_VERSION",
            "url": "https://github.com/$REPO/releases/download/ota-latest/www.zip"
          }
          EOF
          cat dist/latest.json
          echo "Archive : $(du -h dist/www.zip)"

      - uses: actions/upload-artifact@v4
        with:
          name: glucovision-apk
          path: dist/glucovision.apk

      # Releases aux tags fixes : les liens de téléchargement ne changent jamais,
      # seuls les fichiers derrière sont remplacés à chaque build.
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
          APP_VERSION: ${{ steps.version.outputs.app }}
        run: |
          {
            echo "**GlucoVision v$APP_VERSION** — APK signé avec la clé de debug Android :"
            echo "installable directement, sans compte développeur ni Play Store."
            echo
            echo "**Installation** — télécharge \`glucovision.apk\` sur ton téléphone,"
            echo "ouvre-le, et autorise l'installation depuis cette source quand"
            echo "Android le demande."
            echo
            echo "**Mises à jour** — cet APK se met à jour tout seul : il vérifie au"
            echo "lancement s'il existe une version plus récente du contenu web, la"
            echo "télécharge, et propose « Actualiser ». Tu n'as à réinstaller un APK"
            echo "que si une fonctionnalité NATIVE est ajoutée."
            echo
            echo "Build : commit \`$COMMIT\` · taille $APK_SIZE"
          } > notes.md
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest dist/glucovision.apk \
            --title "GlucoVision — APK Android (dernier build)" \
            --notes-file notes.md

      - name: Publier le bundle de mise à jour
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ steps.version.outputs.app }}
        run: |
          {
            echo "Contenu web de GlucoVision v$APP_VERSION, téléchargé automatiquement"
            echo "par l'application Android installée."
            echo
            echo "Rien à télécharger à la main ici."
          } > ota-notes.md
          gh release delete ota-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ota-latest dist/www.zip dist/latest.json \
            --title "GlucoVision — mise à jour du contenu web (v$APP_VERSION)" \
            --notes-file ota-notes.md
